name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev libltdl-dev
          pip install --user --break-system-packages --upgrade buildozer cython

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.buildozer
            ~/.buildozer
          key: kivy-buildozer-${{ hashFiles('buildozer.spec', '.github/workflows/build-apk.yml') }}

      - name: Build debug APK (Kivy)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export LC_ALL=C
          buildozer android debug
        timeout-minutes: 120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mountain-kivy-apk
          path: bin/*.apk